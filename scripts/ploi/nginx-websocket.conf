# Replace the site's "location / { ... }" block in Ploi (Site > Manage > Edit NGINX configuration)
# with this, so wss://<site-domain>/ reaches Turbo's WebSocket server. Ploi's SSL tab
# (Let's Encrypt) terminates TLS; Turbo keeps "security": "none" on loopback.
# The port must match TURBO_WS_PORT in .env.

location / {
    proxy_pass http://127.0.0.1:9001;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Clients can sit idle between pings; do not let nginx close the socket under them.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
}
