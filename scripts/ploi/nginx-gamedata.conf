# Serves the gamedata files at https://<site-domain>/gamedata/ from Turbo's gamedata host. Add
# this block to the NGINX configuration of the site that should serve them (Site > Manage > Edit
# NGINX configuration), beside its other "location" blocks; on the public site, next to its
# "location /api/". The longer prefix wins over the site's "location /", so the app keeps the rest.
# The port must match TURBO_GAMEDATA_URL in the Turbo site's .env. Check with: sudo nginx -t

location /gamedata/ {
    # No path after the port: the request goes on as /gamedata/..., the paths the host serves.
    proxy_pass http://127.0.0.1:8094;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Only GETs are served; nothing is uploaded.
    client_max_body_size 1k;
}
