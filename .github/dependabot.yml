version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-compatible:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      nuget-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
    # EF and its MySQL provider move a major only with the target framework: EF Core 11 and
    # Microting.EntityFrameworkCore.MySql 11 need .NET 11.
    ignore:
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microting.EntityFrameworkCore.MySql"
        update-types: ["version-update:semver-major"]
